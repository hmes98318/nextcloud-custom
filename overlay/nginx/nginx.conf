user nginx;

pid /run/nginx.pid;

worker_processes auto;
worker_rlimit_nofile 65535;

load_module modules/ngx_http_brotli_filter_module.so;
load_module modules/ngx_http_brotli_static_module.so;

error_log /dev/stderr notice;

events {
    worker_connections 16384;
    multi_accept on;
}

http {
    # Logs format
    # ----------

    log_format main '$remote_addr - $host [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time ut=$upstream_response_time';

    access_log /dev/stdout main;
    error_log /dev/stderr warn;

    # ----------

    # Basic settings
    # ----------

    sendfile                    on;
    tcp_nopush                  on;
    tcp_nodelay                 on;
    reset_timedout_connection   on;
    keepalive_timeout           65;
    keepalive_requests          1000;
    types_hash_max_size         4096;
    server_tokens               off;
    server_names_hash_max_size  4096;

    # ----------

    # Common limits
    # ----------

    # Timeouts are long so that users on slow connections can still upload and
    # download large files. Request headers are small, so their timeout stays short.
    client_header_timeout   30s;
    client_body_timeout     3600s;
    send_timeout            3600s;

    # Long-running requests such as assembling uploaded chunks run in PHP-FPM.
    fastcgi_connect_timeout 60s;
    fastcgi_send_timeout    3600s;
    fastcgi_read_timeout    3600s;

    fastcgi_buffers 16 32k;
    fastcgi_buffer_size 64k;

    # ----------

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    # Load modular configuration files from the /etc/nginx/conf.d directory.
    # See http://nginx.org/en/docs/ngx_core_module.html#include
    # for more information.
    include /etc/nginx/conf.d/*.conf;
}
