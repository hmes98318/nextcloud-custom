name: Deploy

on:
  push:
    tags:
      - '*'

permissions:
  contents: read

env:
  PRIVATE_IMAGE: ${{ secrets.DOCKER_REGISTRY }}/${{ secrets.DOCKER_IMAGE }}
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # Build each platform on a native runner and push it by digest only (no tags yet).
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Prepare
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker registry
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.PRIVATE_IMAGE }}
            ${{ env.GHCR_IMAGE }}

      # The layer cache comes from the builds of the main branch (build-test.yml).
      # The runtime stage is rebuilt without cache so that every release picks up
      # the latest Debian security updates (apt-get upgrade in the Dockerfile).
      - name: Build and push by digest
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          no-cache-filters: runtime
          outputs: type=image,"name=${{ env.PRIVATE_IMAGE }},${{ env.GHCR_IMAGE }}",push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.docker_build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Combine the per-platform images into one multi-arch tag.
  merge:
    name: Publish multi-arch manifest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker registry
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.PRIVATE_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          # generate Docker tags based on the following events/attributes
          tags: |
            type=semver,pattern={{version}}
          # always generate latest tag on push
          flavor: |
            latest=true

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          for image in "${PRIVATE_IMAGE}" "${GHCR_IMAGE}"; do
            tag_args=$(jq -cr --arg image "${image}" \
              '.tags | map(select(startswith($image + ":"))) | map("-t " + .) | join(" ")' \
              <<< "${DOCKER_METADATA_OUTPUT_JSON}")
            # shellcheck disable=SC2046,SC2086
            docker buildx imagetools create ${tag_args} \
              $(printf "${image}@sha256:%s " *)
          done

      - name: Inspect images
        run: |
          for image in "${PRIVATE_IMAGE}" "${GHCR_IMAGE}"; do
            docker buildx imagetools inspect "${image}:latest"
          done
